name: WeeklyScheduleApp
options:
  bundleIdPrefix: com.jae.weeklyschedule
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: ko
targets:
  WeeklyScheduleApp:
    type: application
    platform: iOS
    sources:
      - path: WeeklyScheduleApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jae.weeklyschedule.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "주간 시간표"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "부모님 폰에서 빠르고 안전하게 숙제 확인 및 하트 전송을 승인하기 위해 Face ID 인증을 사용합니다."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  WeeklyScheduleMac:
    type: application
    platform: macOS
    sources:
      - path: WeeklyScheduleApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jae.weeklyschedule.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "주간 시간표"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "부모 모드 잠금 해제를 위해 Touch ID 인증을 사용합니다."
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: WeeklyScheduleMac.entitlements
