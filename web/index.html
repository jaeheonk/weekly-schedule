<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>주간 시간표</title>
    
    <!-- PWA / Mobile Safari Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="주간시간표" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Anti-Zoom & Native Viewport Lock Script for Mobile Web / PWA -->
    <script>
      // Block iOS Safari gesture-based pinch zoom
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });
      document.addEventListener('gesturechange', function (e) {
        e.preventDefault();
      });
      document.addEventListener('gestureend', function (e) {
        e.preventDefault();
      });
      // Block multi-touch pinch gestures while keeping single-touch interactions fluid
      document.addEventListener(
        'touchstart',
        function (e) {
          if (e.touches.length > 1) {
            e.preventDefault();
          }
        },
        { passive: false }
      );
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased select-none font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
